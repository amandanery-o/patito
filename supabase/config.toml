[functions.report-problem]
verify_jwt = true

[auth]
enabled = true
site_url = "https://patito-mauve.vercel.app"
additional_redirect_urls = [
  "https://patito-mauve.vercel.app/",
  "https://patito-amanda-nerys-projects.vercel.app/",
  "http://localhost:5173/",
  "http://127.0.0.1:5173/",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600
